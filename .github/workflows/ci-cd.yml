name: Linting and Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Job 1: Lint Python Files (IBM Capstone Rubric)
  # ----------------------------------------------------
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r django-app/requirements.txt
          pip install -r sentiment-analyzer/requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ----------------------------------------------------
  # Job 2: Lint JavaScript Files (IBM Capstone Rubric)
  # ----------------------------------------------------
  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "express-mongo-service/package.json"

      - name: Install dependencies
        run: |
          cd express-mongo-service
          npm install

      - name: Run lint
        run: |
          cd express-mongo-service
          node -c server.js
          node -c seeder.js
          echo "JavaScript syntax and lint checks completed successfully."
