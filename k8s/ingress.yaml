apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autopulse-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # Main Django UI & views
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 80
          # Direct microservice routing if exposed through API gateway
          - path: /api/dealers
            pathType: Prefix
            backend:
              service:
                name: express-service
                port:
                  number: 3030
          - path: /api/sentiment
            pathType: Prefix
            backend:
              service:
                name: sentiment-service
                port:
                  number: 5000
